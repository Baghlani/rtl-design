<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروفایل کاربری</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
            line-height: 1.6;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px 20px;
            text-align: center;
            color: white;
        }

        .profile-image {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.2);
            margin: 0 auto 20px;
            object-fit: cover;
            border: 4px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .user-name {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .join-date {
            font-size: 14px;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .info-section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .info-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding: 12px;
            background-color: #f9f9f9;
            border-radius: 6px;
            border-right: 4px solid #667eea;
        }

        .info-label {
            font-weight: 600;
            color: #667eea;
            min-width: 100px;
            margin-left: 15px;
        }

        .info-value {
            flex: 1;
            color: #555;
        }

        .edit-form {
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: flex-start;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .btn-primary {
            background-color: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background-color: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background-color: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background-color: #d0d0d0;
        }

        .subscription-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .subscription-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .subscription-badge {
            background-color: rgba(255, 255, 255, 0.3);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;
        }

        .subscription-badge.active {
            background-color: #4caf50;
        }

        .subscription-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 15px;
        }

        .detail-item {
            background-color: rgba(255, 255, 255, 0.15);
            padding: 15px;
            border-radius: 6px;
        }

        .detail-label {
            font-size: 12px;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .detail-value {
            font-size: 18px;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .content {
                padding: 20px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .subscription-details {
                grid-template-columns: 1fr;
            }

            .user-name {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header with Profile Image and Name -->
        <div class="header">
            <div class="profile-image">👤</div>
            <div class="user-name">علی رضایی</div>
            <div class="join-date">عضو از: ۱۴۰۲/۱۰/۱۵</div>
        </div>

        <div class="content">
            <!-- Personal Information Section -->
            <div class="info-section">
                <div class="section-title">اطلاعات شخصی</div>

                <div class="info-item">
                    <span class="info-label">شماره موبایل:</span>
                    <span class="info-value">۰۹۱۲۳۴۵۶۷۸۹</span>
                </div>

                <div class="info-item">
                    <span class="info-label">ایمیل:</span>
                    <span class="info-value">ali.rezaei@example.com</span>
                </div>
            </div>

            <!-- Edit Information Form -->
            <div class="info-section">
                <div class="section-title">ویرایش اطلاعات</div>

                <div class="edit-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="first-name">نام:</label>
                            <input type="text" id="first-name" placeholder="نام خود را وارد کنید" value="علی">
                        </div>
                        <div class="form-group">
                            <label for="last-name">نام خانوادگی:</label>
                            <input type="text" id="last-name" placeholder="نام خانوادگی خود را وارد کنید" value="رضایی">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">ایمیل:</label>
                        <input type="email" id="email" placeholder="ایمیل خود را وارد کنید" value="ali.rezaei@example.com">
                    </div>

                    <div class="form-group">
                        <label for="phone">شماره موبایل:</label>
                        <input type="tel" id="phone" placeholder="شماره موبایل خود را وارد کنید" value="۰۹۱۲۳۴۵۶۷۸۹">
                    </div>

                    <div class="button-group">
                        <button class="btn btn-primary">ذخیره تغییرات</button>
                        <button class="btn btn-secondary">لغو</button>
                    </div>
                </div>
            </div>

            <!-- Subscription Card -->
            <div class="info-section">
                <div class="section-title">اشتراک فعال</div>

                <div class="subscription-card">
                    <div class="subscription-header">
                        <span>پلن پریمیوم</span>
                        <span class="subscription-badge active">فعال</span>
                    </div>

                    <div class="subscription-details">
                        <div class="detail-item">
                            <div class="detail-label">تاریخ انقضا</div>
                            <div class="detail-value">۱۴۰۳/۱۰/۱۵</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">مبلغ پرداختی</div>
                            <div class="detail-value">۲۹۹,۰۰۰ تومان</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
