name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  detector:
    name: detector self-tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]  # 3.9 proves the stdlib-only / old-python claim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m py_compile skills/rtl-design/scripts/detect.py
      - run: python tests/check.py

  validate-skill:
    name: agent-skills spec validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "git+https://github.com/agentskills/agentskills.git#subdirectory=skills-ref"
      - run: skills-ref validate skills/rtl-design
